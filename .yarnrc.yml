nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-3.6.1.cjs

# Patches for missing peer metadata in transitive packages. Each entry
# corresponds to a warning yarn printed on install; the packages work fine, they
# just fail to declare what they hand down to their children.
#
# These are declared as `dependencies` on the *parent* rather than as
# `peerDependencies`. A peer requirement is satisfied by whatever the parent
# provides, so adding the peer to the parent only pushes the same complaint one
# level up the tree; giving the parent a real dependency settles it. Ranges match
# the versions this repo already depends on directly, so nothing is duplicated.
packageExtensions:
  # The autocomplete packages pass the algolia clients down to
  # @algolia/autocomplete-shared without declaring them anywhere.
  '@algolia/autocomplete-core@*':
    dependencies:
      '@algolia/client-search': ^5.35.0
      algoliasearch: ^5.35.0
      search-insights: ^2.17.3
  '@algolia/autocomplete-plugin-algolia-insights@*':
    dependencies:
      '@algolia/client-search': ^5.35.0
      algoliasearch: ^5.35.0
  '@docsearch/react@*':
    dependencies:
      '@algolia/client-search': ^5.35.0

  # acorn-jsx needs acorn from its parent; recma-jsx does not pass it down.
  'recma-jsx@*':
    dependencies:
      acorn: ^8.15.0

  # react-virtual 2.10.4 (pulled in by kbar) predates React 18 and its peer range
  # was never widened upstream. packageExtensions can only add peer metadata, not
  # rewrite an existing range, so the range itself cannot be corrected here —
  # marking it optional stops yarn treating stale metadata as a real conflict.
  # It is React-18 compatible in practice; kbar ships it on 18.
  'react-virtual@2.10.4':
    peerDependenciesMeta:
      react:
        optional: true
